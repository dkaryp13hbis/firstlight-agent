<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" fill="none">
  <!-- FirstLight horizontal lockup — PWA header ("lockup only · 24px mark").
       Mark centred on (80,80); wordmark right. -->
  <g>
    <!-- corona: 12 identical ticks, 30° apart around (80,80) -->
    <g stroke="#DFF7F9" stroke-width="6" stroke-linecap="round">
      <line x1="80" y1="24" x2="80" y2="35" transform="rotate(0 80 80)"/>
      <line x1="80" y1="24" x2="80" y2="35" transform="rotate(30 80 80)"/>
      <line x1="80" y1="24" x2="80" y2="35" transform="rotate(60 80 80)"/>
      <line x1="80" y1="24" x2="80" y2="35" transform="rotate(90 80 80)"/>
      <line x1="80" y1="24" x2="80" y2="35" transform="rotate(120 80 80)"/>
      <line x1="80" y1="24" x2="80" y2="35" transform="rotate(150 80 80)"/>
      <line x1="80" y1="24" x2="80" y2="35" transform="rotate(180 80 80)"/>
      <line x1="80" y1="24" x2="80" y2="35" transform="rotate(210 80 80)"/>
      <line x1="80" y1="24" x2="80" y2="35" transform="rotate(240 80 80)"/>
      <line x1="80" y1="24" x2="80" y2="35" transform="rotate(270 80 80)"/>
      <line x1="80" y1="24" x2="80" y2="35" transform="rotate(300 80 80)"/>
      <line x1="80" y1="24" x2="80" y2="35" transform="rotate(330 80 80)"/>
    </g>
    <!-- chart line + first-light dot (slight right reach, like the reference) -->
    <polyline points="48,70 68,58 84,66 106,50" stroke="#2E7CF7"
              stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="108" cy="48" r="6.5" fill="#38E1F0"/>
    <!-- FL — solid bars, small radius; group spans 41–120 = centred on 80 -->
    <g fill="#16213B">
      <rect x="41" y="80" width="12" height="46" rx="4"/>
      <rect x="41" y="80" width="33" height="12" rx="4"/>
      <rect x="41" y="100" width="27" height="11" rx="4"/>
      <rect x="88" y="80" width="12" height="46" rx="4"/>
      <rect x="88" y="114" width="32" height="12" rx="4"/>
    </g>
  </g>
  <!-- wordmark -->
  <text x="168" y="102" font-family="Manrope, 'Segoe UI', sans-serif" font-size="64"
        font-weight="800" letter-spacing="-1.5" fill="#16213B">First<tspan fill="#2E7CF7">Light</tspan></text>
</svg>
