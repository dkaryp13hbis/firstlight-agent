<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" fill="none">
  <!-- FirstLight app icon. Export: 1024 (App Store), 512 maskable (PWA),
       180/120 (iOS), 32/16 (favicon). -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="460" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2E7CF7"/><stop offset="1" stop-color="#38E1F0"/>
    </linearGradient>
  </defs>
  <rect x="7" y="7" width="446" height="446" rx="104" fill="#FFFFFF" stroke="url(#ring)" stroke-width="14"/>

  <!-- corona: 12 identical ticks, exactly 30° apart around centre (230,230) -->
  <g stroke="#DFF7F9" stroke-width="15" stroke-linecap="round">
    <line x1="230" y1="74" x2="230" y2="102" transform="rotate(0 230 230)"/>
    <line x1="230" y1="74" x2="230" y2="102" transform="rotate(30 230 230)"/>
    <line x1="230" y1="74" x2="230" y2="102" transform="rotate(60 230 230)"/>
    <line x1="230" y1="74" x2="230" y2="102" transform="rotate(90 230 230)"/>
    <line x1="230" y1="74" x2="230" y2="102" transform="rotate(120 230 230)"/>
    <line x1="230" y1="74" x2="230" y2="102" transform="rotate(150 230 230)"/>
    <line x1="230" y1="74" x2="230" y2="102" transform="rotate(180 230 230)"/>
    <line x1="230" y1="74" x2="230" y2="102" transform="rotate(210 230 230)"/>
    <line x1="230" y1="74" x2="230" y2="102" transform="rotate(240 230 230)"/>
    <line x1="230" y1="74" x2="230" y2="102" transform="rotate(270 230 230)"/>
    <line x1="230" y1="74" x2="230" y2="102" transform="rotate(300 230 230)"/>
    <line x1="230" y1="74" x2="230" y2="102" transform="rotate(330 230 230)"/>
  </g>

  <!-- chart line + first-light dot -->
  <polyline points="148,200 200,168 240,190 300,148" stroke="#2E7CF7"
            stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="303" cy="146" r="18" fill="#38E1F0"/>

  <!-- FL — solid bars, small corner radius; group spans 125–335 = centred on 230 -->
  <g fill="#16213B">
    <rect x="125" y="226" width="34" height="130" rx="11"/>
    <rect x="125" y="226" width="92" height="34" rx="11"/>
    <rect x="125" y="283" width="76" height="32" rx="11"/>
    <rect x="245" y="226" width="34" height="130" rx="11"/>
    <rect x="245" y="322" width="90" height="34" rx="11"/>
  </g>
</svg>
