<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" fill="none">
  <!-- FirstLight app icon — 9g "sunrise" mark. Export: 1024 (App Store),
       512 maskable (PWA), 180/120 (iOS), 32/16 (favicon). -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="460" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2E7CF7"/><stop offset="1" stop-color="#38E1F0"/>
    </linearGradient>
    <linearGradient id="line" x1="135" y1="195" x2="292" y2="142" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2E7CF7"/><stop offset="1" stop-color="#2E7CF7"/>
    </linearGradient>
  </defs>
  <rect x="7" y="7" width="446" height="446" rx="104" fill="#FFFFFF" stroke="url(#ring)" stroke-width="14"/>
  <!-- corona rays (12 o'clock positions) -->
  <g stroke="#DFF7F9" stroke-width="15" stroke-linecap="round">
    <line x1="230" y1="78"  x2="230" y2="110"/>
    <line x1="230" y1="350" x2="230" y2="382"/>
    <line x1="78"  y1="230" x2="110" y2="230"/>
    <line x1="350" y1="230" x2="382" y2="230"/>
    <line x1="123" y1="123" x2="146" y2="146"/>
    <line x1="314" y1="314" x2="337" y2="337"/>
    <line x1="123" y1="337" x2="146" y2="314"/>
    <line x1="314" y1="146" x2="337" y2="123"/>
    <line x1="154" y1="95"  x2="166" y2="122"/>
    <line x1="306" y1="95"  x2="294" y2="122"/>
    <line x1="95"  y1="154" x2="122" y2="166"/>
    <line x1="95"  y1="306" x2="122" y2="294"/>
  </g>
  <!-- chart line + first-light dot -->
  <polyline points="137,200 190,168 233,190 288,148" stroke="url(#line)"
            stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="291" cy="146" r="18" fill="#38E1F0"/>
  <!-- FL letterforms — solid bars with a SMALL corner radius (~1/3 of bar width) -->
  <g fill="#16213B">
    <rect x="146" y="223" width="34" height="132" rx="11"/>
    <rect x="146" y="223" width="92" height="34" rx="11"/>
    <rect x="146" y="280" width="76" height="32" rx="11"/>
    <rect x="262" y="223" width="34" height="132" rx="11"/>
    <rect x="262" y="321" width="90" height="34" rx="11"/>
  </g>
</svg>
